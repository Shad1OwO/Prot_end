name: tourism-platform
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_ORIGIN: https://${APP_HOST}
    networks:
      caddy:
        aliases: [tourism-web]
      app:
    depends_on: [api]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: [.env]
    environment:
      # Set here, not in .env, so a copied .env.example can never run the API in development mode.
      NODE_ENV: production
      PORT: 4520
      WEB_ORIGIN: https://${APP_HOST}
      API_ORIGIN: https://${APP_HOST}
      # Caddy overwrites X-Forwarded-For with the address it saw; the API rate-limits on that.
      CLIENT_IP_HEADER: x-forwarded-for
    networks:
      caddy:
        aliases: [tourism-api]
      app:
      data:
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: [.env]
    environment:
      NODE_ENV: production
    # app and data are internal-only; egress is what lets the worker reach the AI providers and Google Maps.
    networks: [app, data, egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: travelapp
      POSTGRES_USER: travelncz
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tourism -d tourism"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    command: [redis-server, --appendonly, "yes", --requirepass, "${REDIS_PASSWORD}"]
    volumes: [redis_data:/data]
    networks: [data]
    healthcheck:
      test: [CMD, redis-cli, -a, "${REDIS_PASSWORD}", ping]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_secret_key
    secrets: [minio_access_key, minio_secret_key]
    volumes: [minio_data:/data]
    networks: [data]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4
    # egress lets freshclam download signature updates.
    networks: [data, egress]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    volumes: [./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro, prometheus_data:/prometheus]
    networks: [app]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.0
    environment: { GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password }
    secrets: [grafana_password]
    volumes: [grafana_data:/var/lib/grafana]
    networks: [app]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    command: [--config=/etc/otelcol/config.yaml]
    volumes: [./ops/otel-collector.yaml:/etc/otelcol/config.yaml:ro]
    networks: [app]
    restart: unless-stopped

secrets:
  postgres_password: { file: ./secrets/postgres_password.txt }
  minio_access_key: { file: ./secrets/minio_access_key.txt }
  minio_secret_key: { file: ./secrets/minio_secret_key.txt }
  grafana_password: { file: ./secrets/grafana_password.txt }
networks:
  caddy:
    external: true
  app: { internal: true }
  data: { internal: true }
  # Outbound internet only. It publishes no ports and Caddy is not attached, so nothing on it is reachable from outside.
  egress: {}
volumes:
  postgres_data: {}
  redis_data: {}
  minio_data: {}
  prometheus_data: {}
  grafana_data: {}
