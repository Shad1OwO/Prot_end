global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: tourism-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:4000]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
rule_files:
  - /etc/prometheus/alerts.yml
